name: Source-bound Docker image verification

on:
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Confirm immutable image publication after separate review approval.
        required: true
        type: boolean
        default: false
      source_commit:
        description: Exact lowercase 40-hex workflow commit to publish; must equal github.sha.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Derive exact source metadata
        id: source_metadata
        shell: bash
        run: echo "build_date=$(git show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build source-bound image without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha }}
            COMMIT=${{ github.event.pull_request.head.sha }}
            BRANCH=${{ github.head_ref }}
            BUILD_DATE=${{ steps.source_metadata.outputs.build_date }}

  validate_release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      confirmed: ${{ steps.confirm.outputs.confirmed }}
      source_commit: ${{ steps.confirm.outputs.source_commit }}
    steps:
      - name: Validate explicit release confirmation and source identity
        id: confirm
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          REQUESTED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "${CONFIRM_RELEASE}" != "true" ]]; then
            echo "Release publication was not confirmed." >&2
            exit 1
          fi
          if [[ ! "${WORKFLOW_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "github.sha must be an exact lowercase 40-hex Git SHA." >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be an exact lowercase 40-hex Git SHA." >&2
            exit 1
          fi
          if [[ "${REQUESTED_SOURCE_COMMIT}" != "${WORKFLOW_COMMIT}" ]]; then
            echo "source_commit must equal the checked-out hardened workflow commit." >&2
            exit 1
          fi
          echo "confirmed=true" >> "${GITHUB_OUTPUT}"
          echo "source_commit=${WORKFLOW_COMMIT}" >> "${GITHUB_OUTPUT}"

  publish_release:
    needs: validate_release
    if: github.event_name == 'workflow_dispatch' && needs.validate_release.outputs.confirmed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: hummingbot-image-release
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout exact confirmed source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate_release.outputs.source_commit }}

      - name: Derive exact source metadata
        id: source_metadata
        shell: bash
        run: echo "build_date=$(git show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to DockerHub after manual confirmation
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish immutable source-bound image
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          outputs: type=image,name=hummingbot/hummingbot,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SOURCE_COMMIT=${{ needs.validate_release.outputs.source_commit }}
            COMMIT=${{ needs.validate_release.outputs.source_commit }}
            BRANCH=manual-release
            BUILD_DATE=${{ steps.source_metadata.outputs.build_date }}

      - name: Record canonical image digest
        id: record_digest
        shell: bash
        run: |
          test -n "${{ steps.image.outputs.digest }}"
          echo "Published canonical digest: ${{ steps.image.outputs.digest }}" >> "${GITHUB_STEP_SUMMARY}"
