name: ci

on:
  push:
    branches: [master, development, 'refactor/unit_tests**', 'epic/**']
  pull_request:
    branches: [master, development, 'refactor/unit_tests**', 'epic/**']
    types: [ready_for_review, opened, synchronize, reopened]

jobs:
  run_client:
    name: Check if client files changed
    outputs:
      is_set: ${{ steps.check_files.outputs.is_set }}
      is_scoped: ${{ steps.scope_check.outputs.is_scoped }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: technote-space/get-diff-action@v6
        with:
          PATTERNS: |
            **/*.+(py|pyx|pyd|yml)
      - name: Check if client files are modified
        id: check_files
        if: env.GIT_DIFF
        run: |
          echo ${{ env.GIT_DIFF }}
          echo "::set-output name=is_set::true"
      - name: Determine scoped audit PR
        id: scope_check
        if: env.GIT_DIFF
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          SCOPED=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              hummingbot/client/ui/*|\
              hummingbot/strategy_v2/executors/rsi_position_executor/*|\
              test/hummingbot/client/ui/*|\
              test/rsi_v5/*|\
              test/test_rsi_v5_audit_edge_cases.py|\
              test/test_rsi_v5_controller_import.py|\
              test/test_rsi_v5_runtime.py|\
              test/test_rsi_v5_hyperliquid.py|\
              controllers/directional_trading/rsi_v5.py|\
              controllers/directional_trading/rsi_v5_runtime.py|\
              controllers/directional_trading/rsi_v5_hyperliquid.py|\
              .github/workflows/*|\
              .github/actions/*)
                ;;
              *)
                echo "Out-of-scope file for fast CI: $file"
                SCOPED=false
                break
                ;;
            esac
          done < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "is_scoped=${SCOPED}" >> "$GITHUB_OUTPUT"

  build_hummingbot:
    name: Hummingbot build + stable tests
    needs: run_client
    if: github.event.pull_request.draft == false && needs.run_client.outputs.is_set == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: program-changes
        uses: actions/cache@v3
        env:
          CACHE_NUMBER: 0
        with:
          path: README.md
          key: ${{ runner.os }}-build-${{ env.CACHE_NUMBER }}-${{ hashFiles('hummingbot/*', '**/*.py', '**/*.py*', '**/*.pxd', 'test/*') }}

      - name: Cache conda dependencies
        id: conda-dependencies
        uses: actions/cache@v3
        env:
          CONDA_CACHE_NUMBER: 0
        with:
          path: |
            /home/runner/conda_pkgs_dir/
            /usr/share/miniconda/envs
          key: ${{ runner.os }}-conda-${{ env.CONDA_CACHE_NUMBER }}-${{ hashFiles('setup/environment.yml') }}

      - name: Install environment and Hummingbot
        uses: ./.github/actions/install_env_and_hb
        with:
          program-cache-hit: ${{steps.program-changes.outputs.cache-hit}}
          dependencies-cache-hit: ${{steps.conda-dependencies.outputs.cache-hit}}

      - name: Run pre-commit hooks on diff
        shell: bash
        if: |
          needs.run_client.outputs.is_scoped == 'true' ||
          steps.program-changes.outputs.cache-hit != 'true' ||
          steps.conda-dependencies.outputs.cache-hit != 'true'
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate hummingbot
          pre-commit run --files $(git diff --name-only origin/$GITHUB_BASE_REF)

      - name: Run scoped PR tests
        if: needs.run_client.outputs.is_scoped == 'true'
        shell: bash
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate hummingbot
          coverage run -m pytest \
            test/hummingbot/client/ui/test_interface_utils.py \
            test/test_rsi_v5_audit_edge_cases.py \
            test/test_rsi_v5_runtime.py \
            test/test_rsi_v5_hyperliquid.py \
            test/rsi_v5/test_position_executor_contract.py \
            -q --tb=short

      - name: Run stable tests and calculate coverage
        if: |
          needs.run_client.outputs.is_scoped != 'true' &&
          (steps.program-changes.outputs.cache-hit != 'true' || steps.conda-dependencies.outputs.cache-hit != 'true')
        shell: bash
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate hummingbot
          make test

      - name: Check and report global coverage
        if: |
          needs.run_client.outputs.is_scoped != 'true' &&
          (steps.program-changes.outputs.cache-hit != 'true' || steps.conda-dependencies.outputs.cache-hit != 'true')
        shell: bash
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate hummingbot
          make report_coverage

      - name: Validate coverage for the changes
        if: |
          needs.run_client.outputs.is_scoped != 'true' &&
          github.event_name == 'pull_request' &&
          (steps.program-changes.outputs.cache-hit != 'true' || steps.conda-dependencies.outputs.cache-hit != 'true')
        shell: bash
        run: |
          source $CONDA/etc/profile.d/conda.sh
          conda activate hummingbot
          git fetch --all -q
          git checkout -b $GITHUB_SHA
          coverage xml
          diff-cover --compare-branch=origin/$GITHUB_BASE_REF --fail-under=80 coverage.xml

      - name: Discord Webhook Action
        id: discord-direct-webhook
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: tsickert/discord-webhook@v5.2.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          raw-data: ${{ matrix.target }}-build_report.json

      - uses: ruby/setup-ruby@v1
        if: github.event_name != 'pull_request' && steps.discord-direct-webhook.outcome == 'failure'
      - name: Send Webhook Notification
        if: github.event_name != 'pull_request' && steps.discord-direct-webhook.outcome == 'failure'
        env:
          JOB_STATUS: ${{ job.status }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          HOOK_OS_NAME: ${{ runner.os }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          git clone --depth 1 https://github.com/DiscordHooks/github-actions-discord-webhook.git webhook
          bash webhook/send.sh $JOB_STATUS $WEBHOOK_URL
        shell: bash
